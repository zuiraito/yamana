apiVersion: 1

datasources:
  - name: Yamana
    uid: yamana
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: grafana_ro
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
    jsonData:
      database: yamana
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true

