services: 
  timescaledb: 
    image: timescale/timescaledb:latest-pg17 
    restart: unless-stopped 
    environment: 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: yamana 
      # Used only by initdb/001_init.sh on the very first start 
      COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD} 
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD} 
    ports: 
      # Bound to the Tailscale IP only: not reachable from LAN or internet 
      - "${TAILSCALE_IP}:5432:5432" 
    volumes: 
      - pgdata:/var/lib/postgresql/data 
      - ./initdb:/docker-entrypoint-initdb.d:ro 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d yamana"] 
      interval: 10s 
      timeout: 5s 
      retries: 10 

  grafana: 
    image: grafana/grafana-oss:latest 
    restart: unless-stopped 
    depends_on: 
      timescaledb: 
        condition: service_healthy 
    environment: 
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD} 
      GF_USERS_ALLOW_SIGN_UP: "false" 
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD} 
      # Business Text panel: lets us run JS that draws the <canvas> waterfall
      GF_INSTALL_PLUGINS: marcusolsson-dynamictext-panel 
    ports: 
      - "${TAILSCALE_IP}:3002:3000" 
    volumes: 
      - grafana-data:/var/lib/grafana 
      - ./grafana/provisioning:/etc/grafana/provisioning:ro 
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro 

volumes: 
  pgdata: 
  grafana-data: 
